[package]
name = "sichter"
version = "0.1.0"
description = "Sichter – Fotos und Videos sicher sortieren"
authors = ["Marcel Hecker"]
edition = "2024"

[lib]
# Der `_lib`-Suffix verhindert unter Windows einen Namenskonflikt mit dem Binary.
name = "sichter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
blake3 = "1"
trash = "5"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
