[package]
name = "sichter"
version = "0.1.0"
description = "Sichter – Fotos und Videos sicher sortieren"
authors = ["Marcel Hecker"]
edition = "2024"

[lib]
# Der `_lib`-Suffix verhindert unter Windows einen Namenskonflikt mit dem Binary.
name = "sichter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
blake3 = "1"
trash = "5"
thiserror = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
fast_image_resize = { version = "6", features = ["image"] }
webp = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Import aus der Fotos-Mediathek über PhotoKit (nur lesend, siehe src/photos).
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSKeyValueCoding", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-photos = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "PHAsset", "PHAssetResource", "PHAssetResourceManager", "PHFetchOptions", "PHFetchResult", "PHObject", "PHPhotoLibrary", "PhotosTypes"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
walkdir = "2"
rayon = "1"
proptest = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Nicht `true`: Beim Bauen mit --target (z. B. universal-apple-darwin) entfernt
# `strip = true` die Symbole des Host-Prozedurmakros tauri_macros, rustc findet
# es dann nicht mehr ("can't find crate for tauri_macros"). Nachgestellt und
# per Gegenprobe bestätigt.
strip = "debuginfo"
